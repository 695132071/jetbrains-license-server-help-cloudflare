name: Feature Request
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请尽量说明使用场景，而不仅是实现方式。

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在什么情况下需要这个功能？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望它如何工作（路由、响应、界面、配置等）
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过的其他实现方式或临时绕过方案
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - Worker 路由 / 许可证协议
        - 激活码生成
        - JRebel 接口
        - 静态前端（public/）
        - 部署 / CI
        - 文档
        - 其他
    validations:
      required: true

  - type: checkboxes
    id: willing
    attributes:
      label: 是否愿意提交 PR
      options:
        - label: 我愿意尝试实现该功能
          required: false
